<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="container">
    <h1>Sudoku</h1>
    <p>Fill every row, column and 3×3 box with digits 1–9.</p>

    <!-- The whole board is a form, so Python can receive it later -->
    <form method="post">
      <div id="board" aria-label="Sudoku board">
        {% for r in range(9) %}
          {% for c in range(9) %}
            {% if given[r][c] != 0 %}
              <input class="cell given" name="c{{ r }}{{ c }}"
                     value="{{ given[r][c] }}" readonly>
            {% else %}
              <input class="cell" name="c{{ r }}{{ c }}"
                     value="{{ board[r][c] if board[r][c] != 0 else '' }}"
                     maxlength="1" pattern="[1-9]" inputmode="numeric"
                     autocomplete="off">
            {% endif %}
          {% endfor %}
        {% endfor %}
      </div>

      <!-- Buttons get added in Step 2 -->
    </form>

    <div id="message" role="status">{{ message }}</div>
  </main>
</body>
</html>
